name: JOY IPTV - Tek EXE
on:
  workflow_dispatch:
  push:
    branches: [main, master, source-ui-fix, loading-performance-fix, catalog-category-fix]
    paths:
      - 'IPTV_Oynatici_Windows/**'
      - 'Tests/**'
      - '.github/workflows/windows-portable.yml'
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Kaynak yukleme regresyon testi
        shell: pwsh
        run: |
          dotnet restore Tests/SourceRegression.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Test restore failed.' }
          $cache = if ($env:NUGET_PACKAGES) { $env:NUGET_PACKAGES } else { Join-Path $env:USERPROFILE '.nuget\packages' }
          $native = Get-ChildItem (Join-Path $cache 'videolan.libvlc.windows\3.0.21') -Recurse -Filter libvlc.dll |
            Where-Object { $_.FullName -match 'win-x64|x64' } | Select-Object -First 1
          dotnet run --project Tests/SourceRegression.csproj -c Release -- $native.DirectoryName
          if ($LASTEXITCODE -ne 0) { throw 'Source regression test failed.' }
      - name: VLC motorunu EXE icine gom
        shell: pwsh
        run: ./IPTV_Oynatici_Windows/Derle.ps1
      - name: EXE dosyasini ve gomulu VLC motorunu test et
        shell: pwsh
        run: |
          $exe = Resolve-Path 'IPTV_Oynatici_Windows/yayin/JOY_IPTV_Player.exe'
          $bytes = [IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Gecersiz Windows EXE.' }
          if (Test-Path 'IPTV_Oynatici_Windows/yayin/libvlc') { throw 'Paket tek EXE olmali.' }
          $test = Start-Process -FilePath $exe -ArgumentList '--verify-native' -PassThru
          if (-not $test.WaitForExit(120000)) { $test.Kill(); throw 'VLC motor testi zaman asimi.' }
          if ($test.ExitCode -ne 0) { throw "VLC motoru acilamadi: $($test.ExitCode)" }
          $test = Start-Process -FilePath $exe -ArgumentList '--verify-native' -PassThru
          if (-not $test.WaitForExit(120000)) { $test.Kill(); throw 'Onbellekli VLC testi zaman asimi.' }
          if ($test.ExitCode -ne 0) { throw 'Onbellekli VLC motor testi basarisiz.' }
      - name: Kart gorunumunu ve liste yerlesimini test et
        shell: pwsh
        run: |
          $exe = Resolve-Path 'IPTV_Oynatici_Windows/yayin/JOY_IPTV_Player.exe'
          $image = Join-Path $env:GITHUB_WORKSPACE 'JOY_IPTV_Menu_Onizleme.png'
          $log = Join-Path $env:GITHUB_WORKSPACE 'ui-test-errors.txt'
          $test = Start-Process -FilePath $exe -ArgumentList @('--verify-ui', $image) -RedirectStandardError $log -PassThru
          if (-not $test.WaitForExit(120000)) { $test.Kill(); throw 'Arayuz testi zaman asimi.' }
          if ($test.ExitCode -ne 0) { Get-Content $log; throw 'Arayuz testi basarisiz.' }
          if (-not (Test-Path $image)) { throw 'Arayuz onizlemesi olusmadi.' }
      - name: Tek EXE paketini yukle
        uses: actions/upload-artifact@v4
        with:
          name: JOY_IPTV_Player_Tek_EXE
          path: IPTV_Oynatici_Windows/yayin/JOY_IPTV_Player.exe
          if-no-files-found: error
          retention-days: 14
      - name: Gercek arayuz onizlemesini yukle
        uses: actions/upload-artifact@v4
        with:
          name: JOY_IPTV_Menu_Onizleme
          path: JOY_IPTV_*Onizleme.png
          if-no-files-found: error
          retention-days: 14

